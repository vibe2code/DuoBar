name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and package .app
        run: |
          chmod +x ./tools/build-app.sh
          ./tools/build-app.sh

      - name: Create ZIP
        id: zip
        run: |
          cd build
          ditto -c -k --keepParent ReDuoBar.app ReDuoBar.zip
          echo "ZIP_PATH=$(pwd)/ReDuoBar.zip" >> $GITHUB_ENV

      - name: Sign with Sparkle and Generate appcast
        id: appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          pip3 install --break-system-packages cryptography
          chmod +x ./tools/generate-appcast.py
          TAG="${GITHUB_REF_NAME:-v1.2.0}"
          ./tools/generate-appcast.py "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.appcast.outputs.TAG }}
          name: "ReDuoBar ${{ steps.appcast.outputs.VERSION }}"
          files: |
            build/ReDuoBar.zip
            appcast.xml
          generate_release_notes: true

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp appcast.xml _site/
          cp index.html _site/
          cp -R assets _site/

      - name: Deploy appcast to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: true
          commit_message: "Update appcast for ${{ steps.appcast.outputs.TAG }}"
