<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <!-- ReDuoBar macOS Application Icon -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#232733" />
      <stop offset="50%" stop-color="#15171f" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>

    <!-- Border Glow / Rim Highlight -->
    <linearGradient id="rimGrad" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Arc Electric Cyan-Blue Gradient -->
    <linearGradient id="arcGrad" x1="260" y1="200" x2="764" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#007aff" />
      <stop offset="100%" stop-color="#5856d6" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Squircle -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Radial Top Flare -->
    <radialGradient id="topFlare" cx="512" cy="180" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#007aff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#007aff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- macOS App Icon Squircle Container (standard 824x824 at 100,100 with rx=185) -->
  <g filter="url(#dropShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bgGrad)" />
    <!-- Ambient Inner Flare -->
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#topFlare)" />
    <!-- Border Rim -->
    <rect x="101" y="101" width="822" height="822" rx="184" ry="184" stroke="url(#rimGrad)" stroke-width="2" fill="none" />
  </g>

  <!-- Central ReDuoBar 3-in-1 Status Glyph (Scaled 1.9x to 1024x1024 canvas) -->
  <!-- Scaled Center: cx=512, cy=480, Radius: R=275 -->
  <g transform="translate(512, 480)">
    <!-- Battery Ring Inactive Track (240° arc spanning top/sides, 120° bottom gap) -->
    <!-- Arc from 150° (-238.1, 137.5) to 30° (238.1, 137.5) -->
    <path d="M -238.1 137.5 A 275 275 0 1 1 238.1 137.5"
          stroke="#ffffff"
          stroke-opacity="0.18"
          stroke-width="50"
          stroke-linecap="round" />

    <!-- Glowing Active Battery Arc (85% Charge) -->
    <g filter="url(#softGlow)">
      <path d="M -238.1 137.5 A 275 275 0 1 1 182.2 182.4"
            stroke="url(#arcGrad)"
            stroke-width="50"
            stroke-linecap="round" />
    </g>

    <!-- Crisp Overlay for Active Arc -->
    <path d="M -238.1 137.5 A 275 275 0 1 1 182.2 182.4"
          stroke="#ffffff"
          stroke-width="12"
          stroke-linecap="round"
          stroke-opacity="0.75" />

    <!-- Center Wi-Fi Waves -->
    <g stroke="#ffffff" fill="#ffffff" stroke-linecap="round">
      <!-- Outer wave -->
      <path d="M -136 -76 A 155 155 0 0 1 136 -76"
            stroke-width="34"
            fill="none" />
      <!-- Middle wave -->
      <path d="M -83 -23 A 95 95 0 0 1 83 -23"
            stroke-width="34"
            fill="none" />
      <!-- Center Dot -->
      <circle cx="0" cy="34" r="25" />
    </g>

    <!-- 4 Curved Volume Dots along the bottom gap trajectory (Radius 275) -->
    <!-- Angles: 52° (169.3, 216.7), 77° (61.9, 268.0), 103° (-61.9, 268.0), 128° (-169.3, 216.7) -->
    <g fill="#ffffff">
      <!-- Dot 0 -->
      <circle cx="-169.3" cy="216.7" r="26" opacity="1.0" />
      <!-- Dot 1 -->
      <circle cx="-61.9" cy="268.0" r="26" opacity="1.0" />
      <!-- Dot 2 -->
      <circle cx="61.9" cy="268.0" r="26" opacity="1.0" />
      <!-- Dot 3 (inactive dot, 28% opacity) -->
      <circle cx="169.3" cy="216.7" r="26" opacity="0.25" />
    </g>
  </g>
</svg>
