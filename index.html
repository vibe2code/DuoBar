<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DuoBar for macOS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #161b22;
      padding: 40px;
      border-radius: 16px;
      border: 1px solid #30363d;
      max-width: 480px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.4);
    }
    h1 { color: #f0f6fc; margin-bottom: 8px; }
    p { color: #8b949e; line-height: 1.5; }
    a.button {
      display: inline-block;
      background: #238636;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 16px;
      transition: background 0.2s;
    }
    a.button:hover { background: #2ea043; }
  </style>
</head>
<body>
  <div class="card">
    <h1>DuoBar</h1>
    <p>One compact macOS menu bar indicator for Battery, Network, and Volume.</p>
    <a class="button" href="https://github.com/vibe2code/DuoBar/releases/latest">Download Latest Release</a>
    <p style="margin-top: 24px; font-size: 13px;">
      <a href="appcast.xml" style="color: #58a6ff;">Sparkle Appcast XML</a>
    </p>
  </div>
</body>
</html>
